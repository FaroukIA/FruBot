    <script>
        function addMessage(content, isUser) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = content;
            messageDiv.appendChild(bubbleDiv);
            messagesDiv.appendChild(messageDiv);
            setTimeout(() => {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 0);
            return messageDiv;
        }

        function addLoadingMessage() {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message loading';
            messageDiv.id = 'loading-message';
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            const dotsDiv = document.createElement('div');
            dotsDiv.className = 'loading-dots';
            dotsDiv.innerHTML = '<span></span><span></span><span></span>';
            bubbleDiv.appendChild(dotsDiv);
            messageDiv.appendChild(bubbleDiv);
            messagesDiv.appendChild(messageDiv);
            setTimeout(() => {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 0);
            return messageDiv;
        }

        function removeLoadingMessage() {
            const loadingMessage = document.getElementById('loading-message');
            if (loadingMessage) {
                loadingMessage.remove();
            }
        }

        function toggleSendButton(disable) {
            const sendButton = document.querySelector('.send-button');
            if (disable) {
                sendButton.classList.add('disabled');
                sendButton.style.pointerEvents = 'none';
            } else {
                sendButton.classList.remove('disabled');
                sendButton.style.pointerEvents = 'auto';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            toggleSendButton(true);

            addMessage(message, true);
            input.value = '';

            const loadingMessage = addLoadingMessage();

            try {
                const response = await fetch('https://faroukaa.app.n8n.cloud/webhook/d294ad2b-d0e3-4222-acdd-231b4165ee47', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                await new Promise(resolve => setTimeout(resolve, 500));
                removeLoadingMessage();
                addMessage(data.Réponse, false);
            } catch (error) {
                await new Promise(resolve => setTimeout(resolve, 500));
                removeLoadingMessage();
                addMessage('Erreur lors de la communication avec le serveur.', false);
            } finally {
                toggleSendButton(false);
            }
        }

        function handleKeyPress(event) {
            const sendButton = document.querySelector('.send-button');
            if (event.key === 'Enter' && !sendButton.classList.contains('disabled')) {
                sendMessage();
            }
        }

        function resetConversation() {
            document.getElementById('messages').innerHTML = '';
            toggleSendButton(false);
        }
    </script>
